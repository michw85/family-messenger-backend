name: Deploy to DigitalOcean
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/app/backend"
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: JWT_SECRET,GMAIL_CLIENT_ID,GMAIL_CLIENT_SECRET,GMAIL_REFRESH_TOKEN,GMAIL_SENDER_EMAIL,CORS_ALLOWED_ORIGINS,POSTGRES_PASSWORD,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,FIREBASE_CREDENTIALS_HOST_PATH,TURN_SECRET
          script: |
            cd /app/backend
            cat > .env << EOF
            JWT_SECRET=${JWT_SECRET}
            GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
            GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
            GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
            GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            MINIO_ROOT_USER=${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
            FIREBASE_CREDENTIALS_HOST_PATH=${FIREBASE_CREDENTIALS_HOST_PATH}
            TURN_SECRET=${TURN_SECRET}
            EOF
            docker-compose down
            docker rm -f family-messenger-backend || true
            docker-compose up -d --build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          FIREBASE_CREDENTIALS_HOST_PATH: ${{ secrets.FIREBASE_CREDENTIALS_HOST_PATH }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}