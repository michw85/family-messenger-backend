# Профиль для контекстного теста (BackendApplicationTests.contextLoads) - никогда
# не деплоится, только для проверки, что Spring-контекст поднимается без ошибок,
# не завися от реальных Postgres/MinIO/Firebase на дропле.
# Profile for the context test (BackendApplicationTests.contextLoads) - never
# deployed, only used to verify the Spring context boots cleanly without
# depending on the real droplet's Postgres/MinIO/Firebase.

spring.datasource.url=jdbc:h2:mem:backend-context-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.repositories.enabled=false

minio.url=http://localhost:9000
minio.access-key=test-access-key
minio.secret-key=test-secret-key
minio.bucket-name=test-bucket

jwt.secret=test-only-secret-key-not-used-anywhere-real-1234567890
jwt.expiration=900000
jwt.refresh-expiration=2592000000

app.cors.allowed-origins=http://localhost:19006

turn.shared-secret=test-only-turn-secret
turn.uris=stun:stun.l.google.com:19302
turn.ttl-seconds=3600
