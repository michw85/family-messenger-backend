# application-docker.properties
spring.application.name=backend
server.port=8080

# PostgreSQL – используем имя сервиса из docker-compose
spring.datasource.url=jdbc:postgresql://postgres:5432/messenger
spring.datasource.username=messenger_user
spring.datasource.password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# MinIO
minio.url=http://minio:9000
minio.access-key=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
minio.secret-key=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
minio.bucket-name=messenger-files

# JWT
jwt.secret=${JWT_SECRET:?JWT_SECRET is required}
jwt.expiration=900000
jwt.refresh-expiration=2592000000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://bonds-app.duckdns.org}

# Email (2FA) - через Gmail API (OAuth2, порт 443, не блокируется DigitalOcean)
gmail.client-id=${GMAIL_CLIENT_ID:}
gmail.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.sender-email=${GMAIL_SENDER_EMAIL:bonds.app.dev@gmail.com}

# Firebase Admin SDK (push-уведомления) - путь к JSON сервис-аккаунта, файл
# ВНЕ репозитория, монтируется в контейнер только во время выполнения
# Firebase Admin SDK (push notifications) - path to the service account JSON,
# file lives OUTSIDE the repo, mounted into the container only at runtime
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:?FIREBASE_CREDENTIALS_PATH is required}

# TURN (coturn, use-auth-secret) - общий секрет с контейнером coturn, клиент
# получает только короткоживущие username/credential через /api/calls/turn-credentials
# TURN (coturn, use-auth-secret) - shared secret with the coturn container, the
# client only gets short-lived username/credential via /api/calls/turn-credentials
turn.shared-secret=${TURN_SECRET:?TURN_SECRET is required}
turn.uris=${TURN_URIS:turn:bonds-app.duckdns.org:3478?transport=udp,turn:bonds-app.duckdns.org:3478?transport=tcp,stun:bonds-app.duckdns.org:3478}
turn.ttl-seconds=${TURN_TTL_SECONDS:3600}

# Логирование
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO

#MaxUploadSize
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB