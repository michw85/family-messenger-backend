spring.application.name=backend
# Сервер
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/messenger
spring.datasource.username=messenger_user
spring.datasource.password=messenger_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# MinIO
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket-name=messenger-files

# JWT
jwt.secret=yourSecretKeyAtLeast32CharactersLongPleaseChangeInProduction
jwt.expiration=86400000

# Логирование
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
