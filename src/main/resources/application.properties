# application-docker.properties
spring.application.name=backend
server.port=8080

# PostgreSQL – используем имя сервиса из docker-compose
spring.datasource.url=jdbc:postgresql://postgres:5432/messenger
spring.datasource.username=messenger_user
spring.datasource.password=messenger_pass

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# MinIO
minio.url=http://minio:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket-name=messenger-files

# JWT
jwt.secret=${JWT_SECRET:yourSecretKeyAtLeast32CharactersLongPleaseChangeInProductionForSecurity}
# Access-токен короткоживущий (15 минут), обновляется через /api/auth/refresh
# Access token is short-lived (15 minutes), renewed via /api/auth/refresh
jwt.expiration=900000
# Refresh-токен живёт 30 дней / Refresh token lives for 30 days
jwt.refresh-expiration=2592000000

# CORS - домены, которым разрешены запросы с credentials (через запятую)
# CORS - domains allowed to make requests with credentials (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://bonds-app.duckdns.org}

# Email (2FA - отправка одноразовых кодов входа) - через Gmail SMTP
# Email (2FA - sending one-time login codes) - via Gmail SMTP
# MAIL_USERNAME/MAIL_PASSWORD задаются переменными окружения на сервере (App Password Gmail)
# MAIL_USERNAME/MAIL_PASSWORD are set as environment variables on the server (Gmail App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Логирование
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO