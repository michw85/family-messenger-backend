# Профиль для локальной разработки (без Docker)
spring.application.name=backend
server.port=8080
server.address=0.0.0.0

# Используем H2 базу данных (в памяти)
spring.datasource.url=jdbc:h2:mem:messenger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Отключаем Redis (для локальной разработки)
spring.data.redis.repositories.enabled=false

# MinIO отключаем или используем мок
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket-name=messenger-files

# JWT настройки
jwt.secret=yourSecretKeyAtLeast32CharactersLongPleaseChangeInProductionForSecurity
jwt.expiration=900000
jwt.refresh-expiration=2592000000

# Временно отключаем Spring Security для тестирования (потом вернём)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

spring.web.cors.allowed-origins=*
app.cors.allowed-origins=http://localhost:8081,http://localhost:19006