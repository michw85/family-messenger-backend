# Профиль для локальной разработки (без Docker)
spring.application.name=backend
server.port=8080
server.address=0.0.0.0

# Используем H2 базу данных (в памяти)
spring.datasource.url=jdbc:h2:mem:messenger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Отключаем Redis (для локальной разработки)
spring.data.redis.repositories.enabled=false

# MinIO отключаем или используем мок
minio.url=http://localhost:9000
minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin123}
minio.bucket-name=messenger-files

# JWT настройки (литеральный dev-секрет: этот профиль никогда не деплоится,
# только для локального запуска без Docker)
# JWT settings (literal dev secret: this profile is never deployed,
# local no-Docker runs only)
jwt.secret=yourSecretKeyAtLeast32CharactersLongPleaseChangeInProductionForSecurity
jwt.expiration=900000
jwt.refresh-expiration=2592000000

# ВАЖНО: раньше здесь полностью отключался Spring Security (SecurityAutoConfiguration)
# и CORS был "*" - опасная мина: случайная активация этого профиля вне локальной машины
# сделала бы весь API полностью неавторизованным. Убрано - локальная разработка и так
# нормально работает с обычной JWT-авторизацией.
# IMPORTANT: this used to fully disable Spring Security (SecurityAutoConfiguration) and
# set CORS to "*" - a landmine: accidentally activating this profile anywhere but a local
# machine would make the whole API completely unauthenticated. Removed - local dev works
# fine with normal JWT auth anyway.
app.cors.allowed-origins=http://localhost:8081,http://localhost:19006

# Firebase Admin SDK (push-уведомления) - для чисто локального запуска без
# push-тестирования можно оставить пустым, тогда просто упадёт бин firebaseApp
# при старте (см. FirebaseConfig) - задайте FIREBASE_CREDENTIALS_PATH, если
# нужно тестировать push локально
# Firebase Admin SDK (push notifications) - can be left empty for a purely
# local run without push testing, the firebaseApp bean will then just fail to
# start (see FirebaseConfig) - set FIREBASE_CREDENTIALS_PATH if you need to
# test push locally
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# TURN (coturn) - литеральный dev-секрет, этот профиль никогда не деплоится.
# Без локально запущенного coturn звонки не соединятся через relay, но
# сигналинг и остальной REST/STOMP-код можно тестировать и так.
# TURN (coturn) - literal dev secret, this profile is never deployed. Without
# a locally running coturn, calls won't connect via relay, but signaling and
# the rest of the REST/STOMP code can still be tested.
turn.shared-secret=local-dev-turn-secret
turn.uris=stun:stun.l.google.com:19302
turn.ttl-seconds=3600