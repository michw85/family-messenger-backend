services:
  postgres:
    image: postgres:15
    container_name: family-messenger-postgres
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger_user
      POSTGRES_PASSWORD: messenger_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - messenger-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: family-messenger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - messenger-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: family-messenger-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - messenger-network
    restart: unless-stopped

  backend:
    build: .
    container_name: family-messenger-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - messenger-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  messenger-network:
    driver: bridge

