services:
  postgres:
    image: postgres:15
    container_name: family-messenger-postgres
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - messenger-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: family-messenger-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - messenger-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: family-messenger-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data
    networks:
      - messenger-network
    restart: unless-stopped

  backend:
    build: .
    container_name: family-messenger-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:?GMAIL_CLIENT_ID is required for email 2FA}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:?GMAIL_CLIENT_SECRET is required for email 2FA}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:?GMAIL_REFRESH_TOKEN is required for email 2FA}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-bonds.app.dev@gmail.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://bonds-app.duckdns.org}
      - FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-credentials.json
      - TURN_SECRET=${TURN_SECRET:?TURN_SECRET is required}
    volumes:
      # Файл ключа сервис-аккаунта Firebase лежит на хосте ВНЕ репозитория
      # (например /root/secrets/firebase-credentials.json) и монтируется сюда
      # только для чтения - см. firebase.credentials-path в application-docker.properties
      # The Firebase service-account key file lives on the host OUTSIDE the repo
      # (e.g. /root/secrets/firebase-credentials.json) and is mounted here
      # read-only - see firebase.credentials-path in application-docker.properties
      - ${FIREBASE_CREDENTIALS_HOST_PATH:?FIREBASE_CREDENTIALS_HOST_PATH is required - path on the host to the rotated Firebase service account JSON}:/run/secrets/firebase-credentials.json:ro
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - messenger-network
    restart: unless-stopped

  # TURN/STUN сервер для WebRTC-звонков - самостоятельный, без сторонних служб.
  # network_mode: host нужен из-за широкого диапазона UDP-портов для relay
  # (49152-65535) - публиковать каждый порт через docker-proxy дорого/ненадёжно,
  # это собственная рекомендация coturn для такого диапазона. TURN/STUN не идёт
  # через HTTP-реверс-прокси (тот, что стоит перед backend), поэтому портам
  # нужен отдельный доступ - см. чек-лист файрвола дроплета в плане.
  # TURN/STUN server for WebRTC calls - self-hosted, no third-party service.
  # network_mode: host is needed because of the wide UDP relay port range
  # (49152-65535) - publishing each port through docker-proxy is expensive/
  # unreliable, this is coturn's own recommendation for such a range. TURN/STUN
  # doesn't go through the HTTP reverse proxy in front of backend, so these
  # ports need separate access - see the droplet firewall checklist in the plan.
  coturn:
    image: coturn/coturn:latest
    container_name: family-messenger-coturn
    network_mode: host
    environment:
      - TURN_SECRET=${TURN_SECRET:?TURN_SECRET is required}
    command: >
      turnserver
      --listening-port=3478
      --min-port=49152 --max-port=65535
      --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --realm=bonds-app.duckdns.org
      --no-cli --no-tls --no-dtls
      --log-file=stdout
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  messenger-network:
    driver: bridge

