services:
  postgres:
    image: postgres:15
    container_name: family-messenger-postgres
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger_user
      POSTGRES_PASSWORD: messenger_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - messenger-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: family-messenger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - messenger-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: family-messenger-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - messenger-network
    restart: unless-stopped

  backend:
    build: .
    container_name: family-messenger-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:?GMAIL_CLIENT_ID is required for email 2FA}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:?GMAIL_CLIENT_SECRET is required for email 2FA}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:?GMAIL_REFRESH_TOKEN is required for email 2FA}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-bonds.app.dev@gmail.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://bonds-app.duckdns.org}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - messenger-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  messenger-network:
    driver: bridge

